[workspace]
channels = ["conda-forge"]
name = "spot-rl"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[activation.env]
BOSDYN_CLIENT_USERNAME="user"
BOSDYN_CLIENT_PASSWORD="PutYourPasswordHere"

[tasks]
doyourthing = "python spot_rl_demo.py 192.168.50.3 --policy_file_path ./models -v"

[dependencies]
spatialmath-python = ">=1.1.15,<2"
onnxruntime = ">=1.22.2,<2"

[pypi-dependencies]
bosdyn-api = { path = "vendor/bosdyn_api-5.1.1-py3-none-any.whl" }
bosdyn-client = { path = "vendor/bosdyn_client-5.1.1-py3-none-any.whl" }
bosdyn-core = { path = "vendor/bosdyn_core-5.1.1-py3-none-any.whl" }
spot-rl-runtime = { path = "spot_rl_runtime", editable = true }
